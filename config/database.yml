# PostgreSQL. Versions 9.3 and up are supported.
#
# Development and test use the PostgreSQL server on your own computer
# (e.g. `brew services start postgresql@14`). No username/password is needed
# locally because Homebrew's PostgreSQL trusts your Mac user.
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Don't try Kerberos (GSS) encryption. Nobody uses it here, and on macOS it
  # crashes forked processes such as parallel test workers.
  gssencmode: disable

development:
  <<: *default
  database: bookshelf_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: bookshelf_test
  # GitHub Actions (and any other CI) passes its own server address here.
  url: <%= ENV["DATABASE_URL"] %>

# Production (Fly.io) uses ONE PostgreSQL database for everything: the app's
# tables plus Solid Cache, Solid Queue and Solid Cable (see their migrations
# in db/migrate). Fly sets DATABASE_URL when the database is attached.
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
